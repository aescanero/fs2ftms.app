name: build

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Tests y APK
        run: ./gradlew test assembleRelease --stacktrace
      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk "fs2ftms-v0.1.${VERSION_CODE}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: fs2ftms-*.apk
      - name: Publicar Release
        if: github.ref == 'refs/heads/main' && env.KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${VERSION_CODE}" "fs2ftms-v0.1.${VERSION_CODE}.apk" \
            --title "fs2ftms v0.1.${VERSION_CODE}" --generate-notes
